services:
  enforcer:
    build: .
    container_name: softpip-enforcer
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "main.py", "--config", "/app/config.yaml"]
